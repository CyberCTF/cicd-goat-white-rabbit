# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# White Rabbit (CI/CD Goat, CICD-SEC-4 Poisoned Pipeline Execution): a live, two-machine CI/CD lab.
# A Jenkins controller runs a multibranch pipeline for Wonderland's white-rabbit repository, hosted
# on a Gitea server. The flag is a string credential in the Jenkins credential store at GLOBAL scope
# — so ANY pipeline can bind it. An attacker with write access to the repo pushes a branch whose
# Jenkinsfile reads flag1 and prints it base64-encoded; the SCM-poll trigger builds it and the flag
# lands in the build console. This is Direct-PPE. See https://www.isoloom.com.
version: 1
name: cicd-goat-white-rabbit

networks:
  lab: { cidr: 10.38.0.0/24 }

# The per-player flag, issued by CyberCTF and handed to the lab by the launcher as a FILE (never an
# environment value, so it never shows in `docker inspect`, an image layer or a generated file). The
# Jenkins entrypoint stages it into the directory JCasC reads file secrets from, so the flag1
# credential resolves at boot. Optional: an offline start (local, CI) leaves it empty and the lab
# stages its inert development placeholder instead, so the lab still comes up and is solvable.
#   CTF_FLAG_WHITE_RABBIT  objective `white-rabbit`  (SECRET: Wonderland's flag1 release token)
inputs:
  CTF_FLAG_WHITE_RABBIT:
    description: the white-rabbit flag, injected into the Jenkins credential store as flag1 (GLOBAL)

machines:
  # Wonderland's git host: Gitea, holding the private Wonderland/white-rabbit repository. The setup
  # job provisions the org, the attacker user (alice, write) and the Jenkins poller (jenkins, read),
  # then pushes the sample project with its Jenkinsfile. No `publish` number: `publish: true` asks
  # the runner for a free host port it picks at `up` time (dynamic), so two labs never collide.
  gitea:
    app:
      build: build/gitea
    networks: { lab: 12 }
    resources: { cpus: 1, memory_mb: 1024 }
    volumes: { data: /data }
    ports:
      web: { port: 3000, protocol: http, publish: true }
    setup: [build/gitea/seed.sh]

  # Wonderland's Jenkins controller: a git-backed multibranch pipeline for white-rabbit, rescanned
  # every minute (the SCM-poll trigger). flag1 is a GLOBAL-scope string credential, the upstream
  # mis-configuration. The per-player flag arrives as a root-only file; only the entrypoint reads it.
  jenkins:
    app:
      build: build/jenkins
    networks: { lab: 10 }
    resources: { cpus: 2, memory_mb: 2048 }
    ports:
      web: { port: 8080, protocol: http, publish: true }
    files:
      - { path: /run/lab/secrets/flag1, input: CTF_FLAG_WHITE_RABBIT }

# From the player's side, on every target: reachability checks that both services answer, and the
# intended path as a solver that runs inside the Jenkins controller — it performs Direct-PPE end to
# end (clone with the attacker's write creds, poison the Jenkinsfile, push + open a PR, read the
# build console) and proves the GLOBAL-scope flag was exfiltrated, without ever printing it. Jenkins
# is slow to boot and the pipeline needs a scan + a build, so the waits are generous.
checks:
  - name: the Gitea git host answers
    http: http://gitea:3000/
    wait: 3m
  - name: the Jenkins controller answers
    http: http://jenkins:8080/login
    wait: 5m
  - name: the GLOBAL-scope flag1 credential is exfiltrated via a poisoned pipeline
    from: jenkins
    exec: bash /usr/local/bin/wr-solve
    wait: 6m

# Shown when the lab is up.
message: |
  Wonderland runs CI on **Jenkins**, building the **Wonderland/white-rabbit** repository hosted on
  **Gitea** on every branch and pull request. You have an account with **write** access to the repo.

  - Gitea:   {{ machines.gitea.ports.web.url }}   (sign in as `alice` / `alice`)
  - Jenkins: {{ machines.jenkins.ports.web.url }} (sign in as `admin` / `admin` to read build consoles)

  Wonderland's release token is stored as a Jenkins credential, `flag1`, at **Global** scope — so any
  pipeline on the controller can read it. Clone the repository, and remember: whoever controls the
  `Jenkinsfile` controls what the pipeline runs.

  ```
  git clone {{ machines.gitea.ports.web.url }}Wonderland/white-rabbit.git
  ```

  Poison the pipeline to bind `flag1` and print it in a form the console will not mask (Jenkins masks
  the raw value *and* its plain base64 — reverse it first, e.g. `echo $flag1 | rev | base64`), push
  the branch and open a pull request; then read the build's console output in Jenkins.
