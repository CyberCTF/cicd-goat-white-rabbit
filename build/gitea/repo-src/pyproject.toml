[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whiterabbit"
version = "0.3.0"
description = "A pocket watch for Wonderland's scheduling service."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Wonderland Engineering", email = "eng@wonderland.example" }]

[tool.setuptools.packages.find]
where = ["src"]
